name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install registry tools
        run: npm install vsce ovsx

      - name: Build VSIX
        run: npx vsce package --out strata-copilot-chat-0.3.0.vsix

      - name: Publish to Open VSX
        run: npx ovsx publish strata-copilot-chat-0.3.0.vsix --trusted-publishing --skip-duplicate

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath strata-copilot-chat-0.3.0.vsix --skip-duplicate
